<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Robotspelet</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Robotspelet">
<meta name="theme-color" content="#0b0e1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&family=Vazirmatn:wght@500;700&display=swap">
</head>
<body>
<style>
/* One full-screen game shell: home, game stage with HUD, question card, sheets and the sleep screen. Single dark look by design. */
:root{color-scheme:dark;--bg:#0b0e1a;--panel:#151a2c;--ink:#f2f3ff;--muted:#a6acd0;--accent:#ffc83d;--line:#262c47;
  --display:'Fredoka','Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:max(14px,env(safe-area-inset-left,0px));--sr:max(14px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
html,body{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
img,svg,canvas{-webkit-user-drag:none;pointer-events:auto}
body{font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:var(--display);color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.screen{position:fixed;inset:0}
/* home */
#home{display:flex;flex-direction:column;padding:calc(var(--st) + 14px) var(--sr) calc(var(--sb) + 14px) var(--sl);gap:14px;background:radial-gradient(120% 90% at 20% 0%,#1d2550 0%,#0b0e1a 60%)}
.h-top{display:flex;align-items:center;gap:12px}
.h-top h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vh,40px);margin:0;letter-spacing:.01em}
.grow{flex:1}
.games{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0}
.gcard{position:relative;border:0;border-radius:28px;padding:18px 20px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;text-align:left;overflow:hidden;min-height:0;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.gcard:active{transform:translateY(5px);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.gcard svg.art{position:absolute;inset:0;width:100%;height:100%}
.gcard b{position:relative;font-size:clamp(24px,6vh,44px);font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.gcard span{position:relative;font-family:var(--body);font-weight:800;font-size:clamp(12px,2.6vh,16px);background:rgba(0,0,0,.35);padding:5px 10px;border-radius:99px;margin-top:6px}
.g-mine{background:#3a2a1c}.g-drag{background:#141a3a}
.gcard img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity .7s ease,transform 12s ease-out}
.gcard img.art.on{opacity:1;transform:scale(1)}
.gcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.7) 100%);pointer-events:none}
.gcard b,.gcard span{z-index:2}
.gcard{box-shadow:0 10px 0 rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.12)}
.pin{display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:6px}
.pin p{margin:0;font-weight:800;color:var(--muted)}
.pdots{display:flex;gap:14px}.pdots i{width:16px;height:16px;border-radius:50%;border:2px solid #8a90b8}.pdots i.on{background:#ffc83d;border-color:#ffc83d}
.pdots.shake{animation:shake .4s}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:10px}
.pad button{height:52px;border:0;border-radius:16px;background:rgba(255,255,255,.1);font-size:24px;font-weight:700}
.pad button:active{background:rgba(255,255,255,.22)}
/* chips & buttons */
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:rgba(10,12,30,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap;pointer-events:auto}
.batt{width:30px;height:16px;border:2.5px solid #fff;border-radius:5px;position:relative;padding:2px;box-sizing:border-box;display:inline-block}
.batt::after{content:"";position:absolute;right:-6px;top:3px;width:3px;height:6px;background:#fff;border-radius:0 2px 2px 0}
.batt i{display:block;height:100%;width:70%;background:#7ee35b;border-radius:2px;transition:width .5s}
.round{width:46px;height:46px;border-radius:50%;border:0;background:rgba(10,12,30,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);pointer-events:auto;flex:none}
.round svg{width:24px;height:24px}
.round.big{width:64px;height:64px}.round.big svg{width:32px;height:32px}
.round.ready{background:#ffc83d;color:#4a2c00;animation:breathe 2.4s ease-in-out infinite}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:10px 18px;font-weight:700;font-size:17px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);pointer-events:auto;white-space:nowrap}
.pill svg{width:20px;height:20px}
.pill.strong{background:#ffc83d;color:#3a2400;box-shadow:0 4px 0 #b88700}
.pill.strong:active{transform:translateY(3px);box-shadow:0 1px 0 #b88700}
.pill.dim{opacity:.55}
.pill.wide{width:100%;margin-bottom:12px}
.coini{display:inline-block;width:var(--s,20px);height:var(--s,20px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2,#ffc83d 45%,#b97a00);box-shadow:inset 0 0 0 2px rgba(140,80,0,.35);vertical-align:middle;flex:none}
.gemi{display:inline-block;width:var(--s,18px);height:var(--s,18px);transform:rotate(45deg) scale(.82);border-radius:22%;background:linear-gradient(135deg,#fff 0%,var(--g) 38%,color-mix(in srgb,var(--g) 60%,#000) 100%);box-shadow:0 0 8px color-mix(in srgb,var(--g) 60%,transparent);vertical-align:middle;flex:none}
/* game */
#stage{position:absolute;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--display)}
.hud-top{position:absolute;top:calc(var(--st) + 10px);left:var(--sl);right:var(--sr);display:flex;align-items:center;gap:10px}
.inv{display:flex;gap:8px;pointer-events:auto}
.slot{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:99px;background:rgba(10,12,30,.6);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.slot b{font-size:18px}.slot small{font-size:13px;opacity:.7}
.bump{animation:bump .4s}
.m-tools{position:absolute;right:var(--sr);bottom:calc(var(--sb) + 10px);display:flex;flex-direction:column;gap:6px}
.tool{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:auto}
.tool em{font-style:normal;font-weight:700;font-size:13px;text-shadow:0 1px 3px #000}
.slot.goal{gap:6px}.slot.goal .dicon{width:16px;height:16px}
.buyprog{background:linear-gradient(90deg,rgba(255,200,61,.45) var(--p),rgba(255,255,255,.1) var(--p))}
.hotbar{position:absolute;left:50%;bottom:calc(var(--sb) + 10px);transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:20px;background:rgba(10,12,30,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);pointer-events:auto}
.hb{position:relative;width:64px;height:64px;border:0;border-radius:14px;padding:6px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.hb img{width:100%;height:100%;image-rendering:pixelated;border-radius:6px;display:block}
.hb b{position:absolute;right:-4px;bottom:-4px;min-width:24px;height:24px;border-radius:12px;background:#fff;color:#22203e;font:700 14px/24px var(--display);text-align:center;padding:0 4px}
.hb.on{box-shadow:inset 0 0 0 3px #ffc83d;background:rgba(255,200,61,.18)}
.m-status{position:absolute;top:calc(var(--st) + 62px);left:var(--sl);display:flex;align-items:center;gap:8px;pointer-events:none}
.hearts{display:flex;gap:2px;padding:5px 8px;border-radius:99px;background:rgba(10,12,30,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hearts.hit{animation:shake .4s}
.heart{width:20px;height:20px;fill:#ff3b5c;stroke:#fff;stroke-width:1.4}.heart.empty{fill:rgba(255,255,255,.12);stroke:rgba(255,255,255,.5)}
.foodbtn{display:flex;align-items:center;gap:4px;border:0;border-radius:99px;padding:4px 10px 4px 6px;background:rgba(10,12,30,.55);color:#fff;font-weight:700;font-size:15px;pointer-events:auto}
.foodi{width:24px;height:24px;display:inline-block;vertical-align:middle}
.daynight{width:26px;height:26px;border-radius:50%;display:inline-block}.daynight.sun{background:radial-gradient(circle,#fff3b0,#ffc83d 60%,#ff9a1f);box-shadow:0 0 12px #ffc83d}.daynight.moon{background:radial-gradient(circle at 35% 35%,#fff,#c8d0f0);box-shadow:0 0 10px #8fa0ff}
.leath{display:inline-block;width:18px;height:18px;border-radius:4px;background:#a0643a;box-shadow:inset 0 0 0 2px #7a4a2a,inset 0 0 0 4px #b8784a;vertical-align:middle}
.bicon{width:20px;height:20px;image-rendering:pixelated;border-radius:3px;vertical-align:middle}
.flash{perspective:1000px;width:min(420px,100%);margin:0 auto;cursor:pointer}
.flash-in{position:relative;transition:transform .5s;transform-style:preserve-3d;min-height:clamp(220px,60vh,360px)}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.fl-front,.fl-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fl-front{border-radius:20px;overflow:hidden;background:#121729;display:flex;flex-direction:column;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.fl-front img{width:100%;flex:1;min-height:0;object-fit:cover}
.fl-front b{font-family:var(--display);font-size:22px;padding:10px 14px 2px}
.fl-front span{font-size:13px;color:var(--muted);padding:0 14px 12px;font-weight:800}
.fl-back{transform:rotateY(180deg);overflow:auto}
.fl-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px;font-family:var(--display);font-weight:700}
.hintb{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.9);opacity:0;background:#fffdf7;color:#22203e;font-weight:700;font-size:22px;padding:14px 22px;border-radius:20px;transition:.3s;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.hintb.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.fly{position:fixed;z-index:60;pointer-events:none;transform:translate(0,0);transition:transform .65s cubic-bezier(.5,0,.3,1),opacity .65s;margin:-17px 0 0 -17px}
/* question card */
.qmodal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(5,6,16,.35);padding:calc(var(--st) + 8px) var(--sr) calc(var(--sb) + 8px) var(--sl)}
.qmodal.on{display:flex}
.qmodal.race{align-items:flex-end;background:transparent}
.qcard{background:#fffdf7;color:#22203e;border-radius:26px;padding:14px 18px 18px;width:min(560px,100%);box-shadow:0 8px 0 rgba(0,0,0,.22),0 20px 50px rgba(0,0,0,.4);animation:rise .25s ease-out}
.qmodal.race .qcard{width:min(520px,100%);margin-bottom:6px}
.qhead{display:flex;align-items:center;gap:10px}
.qtitle{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.07em;text-transform:uppercase;color:var(--q)}
.speak{margin-left:auto;width:44px;height:44px;border-radius:50%;border:0;background:var(--q,#6a4cff);color:#fff;display:grid;place-items:center;flex:none}
.speak svg{width:24px;height:24px}
.qbody{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:4px 0 14px;min-height:64px}
.qbody .hint{font-family:var(--display);font-weight:500;font-size:19px;color:#6b6890}
.qbody .big{font-family:var(--display);font-weight:700;font-size:clamp(30px,8vh,48px);line-height:1.1;color:#22203e;text-align:center}
.qbody .big.word{letter-spacing:.05em;color:var(--q)}
.qbody .emo{font-size:clamp(44px,11vh,64px)}
.dots{display:inline-flex;flex-wrap:wrap;gap:8px;max-width:300px;justify-content:center}.dots .gemi{--s:28px}
.answers{display:flex;gap:12px}
.ans{flex:1;min-height:clamp(54px,13vh,76px);font-weight:700;font-size:clamp(24px,6vh,34px);color:#fff;border:0;border-radius:20px;padding:6px;background:var(--c);box-shadow:0 6px 0 var(--d),inset 0 3px 0 rgba(255,255,255,.25);text-shadow:0 2px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s,opacity .3s}
.ans:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d)}
.ans.pic{color:#000;text-shadow:none;font-size:clamp(30px,8vh,46px);box-shadow:0 6px 0 var(--d),inset 0 0 0 2px #e4e0f0}
.ans.txt{font-size:clamp(18px,4.6vh,26px);letter-spacing:.04em}
.ans.swatch{box-shadow:0 6px 0 var(--d),inset 0 0 0 3px rgba(0,0,0,.08)}
.em-big{font-size:1.25em}.em-small{font-size:.6em}.em-row{font-size:.62em;letter-spacing:-.05em;word-break:break-all;line-height:1.05}
.clock{width:clamp(96px,27vh,140px);height:auto;display:block}
.shp{display:inline-block;width:clamp(26px,7vh,38px);height:clamp(26px,7vh,38px);background:var(--c);vertical-align:middle;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.shp-c{border-radius:50%}.shp-s{border-radius:6px}.shp-t{clip-path:polygon(50% 4%,96% 92%,4% 92%);box-shadow:none}
.pat,.nl{display:inline-flex;align-items:center;gap:clamp(5px,1.4vh,10px);flex-wrap:wrap;justify-content:center}
.nl b{min-width:clamp(44px,12vh,62px);padding:4px 8px;border-radius:12px;background:#efeaff;color:#22203e;font-size:clamp(24px,6.5vh,36px);text-align:center}
.pat .q,.nl .q{display:inline-grid;place-items:center;min-width:clamp(38px,10vh,56px);height:clamp(38px,10vh,52px);border-radius:12px;border:3px dashed var(--q);color:var(--q);background:#fff;font-size:clamp(22px,6vh,32px)}
.rows{display:inline-flex;flex-direction:column;gap:4px;align-items:center}.rows span{display:flex;gap:5px}.rows .gemi{--s:clamp(18px,5vh,26px)}
.ans.pic .shp{width:clamp(30px,8vh,44px);height:clamp(30px,8vh,44px)}
.ans.carpick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;color:#22203e;text-shadow:none;font-size:clamp(16px,4.4vh,22px)}
.ans.carpick img{width:100%;height:clamp(56px,17vh,96px);object-fit:cover;border-radius:12px;pointer-events:none}
.fa{font-family:'Vazirmatn','Geeza Pro','Tahoma',sans-serif;direction:rtl;unicode-bidi:isolate}
.qbody .hint .fa{font-size:20px;color:#6b6890}
.fa-letter{font-size:clamp(56px,16vh,90px);line-height:1;color:var(--q)}
.fa-word{font-size:clamp(40px,11vh,64px);line-height:1.1;letter-spacing:0;color:var(--q)}
.ans.fa-ans .fa{font-size:clamp(26px,7vh,40px);line-height:1}
.ans.fa-l .fa{font-size:clamp(34px,9vh,52px)}
.ans.ok{--c:#47c42c!important;--d:#2b8616!important;color:#fff;animation:pop .45s}
.ans.no{animation:shake .4s}.ans.gone{opacity:.3;pointer-events:none}
/* sheets */
#panel{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(5,6,16,.55);padding:calc(var(--st) + 10px) var(--sr) calc(var(--sb) + 10px) var(--sl)}
#panel.on{display:flex}
.sheet{background:#141a2e;border:1px solid #2a3150;border-radius:26px;width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:rise .22s ease-out}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 14px 8px 20px}
.sheet-head h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;flex:1;color:#fff}
.sheet-body{padding:0 18px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body h3{font-family:var(--display);font-weight:600;font-size:17px;color:var(--muted);margin:10px 0 8px}
/* mine panels */
.drills{display:flex;flex-direction:column;gap:8px}
.drill{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.05)}
.drill.next{background:rgba(255,200,61,.1);box-shadow:inset 0 0 0 2px rgba(255,200,61,.5)}
.drill.later{opacity:.45}
.drill>div{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.drill b{font-family:var(--display);font-size:18px}.drill span{font-size:14px;color:var(--muted)}
.dicon{width:30px;height:30px;flex:none;background:var(--dc);clip-path:polygon(50% 100%,0 0,100% 0);border-radius:4px}
.okmark svg{width:26px;height:26px;color:#7ee35b}
.costs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cost{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.3);font-size:14px}
.cost b{font-family:var(--display)}.cost em{font-style:normal;color:var(--muted)}
.cost.ok{box-shadow:inset 0 0 0 2px #7ee35b}
.paints{display:flex;flex-wrap:wrap;gap:10px}
.paint{position:relative;width:62px;height:62px;border-radius:18px;border:0;background:rgba(255,255,255,.06);display:grid;place-items:center}
.paint i{width:36px;height:36px;border-radius:50%;background:var(--pc)}
.paint.on{box-shadow:inset 0 0 0 3px #ffc83d}
.paint.locked i{opacity:.35}
.pcost{position:absolute;bottom:3px;left:0;right:0;font-size:12px;display:flex;justify-content:center;align-items:center;gap:2px}.pcost .gemi{--s:11px}
.stones{display:flex;flex-wrap:wrap;gap:10px}
.stone{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.05)}
.stone b{font-family:var(--display);font-size:18px}.stone em{font-style:normal;color:var(--muted);font-size:14px}
.stone.unknown{opacity:.4}
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.layer{border:0;border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--lc) 35%,#141a2e);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.layer b{font-size:18px}.layer span{display:flex;align-items:center;gap:6px;font-family:var(--body);font-size:13px;font-weight:800}
.layer span svg{width:16px;height:16px}
.layer.on{box-shadow:inset 0 0 0 3px #ffc83d}.layer.locked{opacity:.5}
.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.tab{border:0;border-radius:99px;padding:9px 18px;font-weight:700;font-size:16px;background:rgba(255,255,255,.08)}
.tab.on{background:#ffc83d;color:#3a2400}
.shelf{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.item{position:relative;flex:0 0 168px;scroll-snap-align:start;border-radius:20px;padding:26px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:linear-gradient(180deg,color-mix(in srgb,var(--ic) 22%,#1a2036),#141a2e);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.item.mine{box-shadow:inset 0 0 0 3px #ffc83d}
.item.next{box-shadow:inset 0 0 0 2px rgba(255,200,61,.6)}
.item.later{opacity:.5}
.item.done{opacity:.75}
.item b{font-family:var(--display);font-size:17px}
.item-art{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)}

      <svg class="art" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="400" height="260" fill="#0c1230"/>
        <g fill="#1d2550"><rect x="10" y="40" width="40" height="120"/><rect x="60" y="70" width="50" height="90"/><rect x="290" y="30" width="45" height="130"/><rect x="345" y="80" width="50" height="80"/></g>
        <g fill="#ffd98a" opacity=".7"><rect x="20" y="55" width="6" height="6"/><rect x="34" y="80" width="6" height="6"/><rect x="72" y="90" width="6" height="6"/><rect x="300" y="50" width="6" height="6"/><rect x="318" y="90" width="6" height="6"/><rect x="360" y="100" width="6" height="6"/></g>
        <polygon points="0,260 160,160 240,160 400,260" fill="#23262e"/>
        <polygon points="196,160 204,160 214,260 186,260" fill="#ffc400"/>
        <g transform="translate(110 168)">
          <path d="M10 46 L18 30 Q60 6 110 10 L160 22 Q176 26 178 40 L178 48 Z" fill="#ff7a1a"/>
          <path d="M66 14 Q90 6 116 12 L106 24 L70 24Z" fill="#0a0d14"/>
          <circle cx="44" cy="50" r="14" fill="#15161a"/><circle cx="44" cy="50" r="7" fill="#c7ccd6"/>
          <circle cx="146" cy="50" r="14" fill="#15161a"/><circle cx="146" cy="50" r="7" fill="#c7ccd6"/>
          <rect x="160" y="28" width="16" height="4" rx="2" fill="#eaf6ff"/>
        </g>
      </svg>
      <img class="art" id="dragArt" alt="">
      <b>Dragracet</b><span id="dragInfo"></span>
    </button>
  </div>
</div>

<div id="game" class="screen" hidden><div id="stage"></div><div id="hud"></div></div>

<div id="sleep" class="screen" hidden>
  <button class="round gearbtn" id="parentBtn2" aria-label="För föräldrar"></button>
  <div class="zz">Z z z</div>
  <div class="sleepbot"><div class="h"></div><div class="v"><i></i><i></i></div><div class="b"></div></div>
  <h2>Batteriet är slut</h2>
  <p>Robo sover nu. Vi ses imorgon!</p>
  <button class="pill" id="extendBtn" style="margin-top:18px;font-size:14px;opacity:.75">Förläng tiden (förälder)</button>
</div>

<div id="qmodal" class="qmodal"></div>
<div id="panel"></div>
<div id="toast"></div>
<div id="rotate" class="screen"><div class="ph"></div>Vänd telefonen på sidan<button class="pill" onclick="document.body.classList.add('portrait-ok')">Spela ändå</button></div>
<div id="bootErr" class="screen"><p style="font-size:22px;margin:0">Spelet kunde inte starta.</p><p style="margin:0;color:#a6acd0">Ladda om sidan. Om det inte hjälper: uppdatera iPhone/iPad (iOS 15 eller senare) och öppna länken i Safari.</p><button class="pill" onclick="location.reload()">Ladda om</button></div>
<script>setTimeout(function(){ if(!window.__booted){ var e=document.getElementById('bootErr'); if(e) e.className+=' on'; } }, 15000);</script>

<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import { S, save, $, ICON, timer, updateBatteries, audioInit, initCloud, say, sfx, openPanel, closePanel, resetProgress, rand, toast, coinIcon, music, createView, cloudReady, isLite } from './core.js';
import { TRACKS as LT, LEVEL_TEXT, skill, levelOf, setLevel, accuracy, faProgress, faSetLevel } from './learn.js';
import * as mine from './mine.js';
import * as drag from './drag.js';
import { TRACKS, CARS } from './cars.js';

window.__booted = true;
$('#parentBtn').innerHTML = ICON.gear; $('#parentBtn2').innerHTML = ICON.gear;
const NOTE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 17.5A3 3 0 1 1 7 14.7V4l12-2v12.5a3 3 0 1 1-2-2.8V6.3L9 7.6z"/></svg>';
const drawMusic = () => { const b = $('#musicBtn'); b.innerHTML = NOTE; b.style.opacity = music.on ? 1 : .4; };
drawMusic();
$('#musicBtn').onclick = () => { audioInit(); music.toggle(); if (music.on) music.mood('home'); drawMusic(); };
document.addEventListener('pointerdown', () => { audioInit(); if (music.on) music.mood(current === mine ? 'mine' : current === drag ? 'drag' : 'home'); }, { once: true });
let current = null;
const api = { exit: goHome, refreshBattery: updateBatteries };

function renderHome() {
  const m = S.mine, d = S.drag;
  $('#mineInfo').textContent = `${mine.LAYERS[Math.min(m.drill, mine.LAYERS.length - 1)].n} · ${mine.DRILLS[m.drill].n}`;
  const open = TRACKS.filter((_, i) => drag.trackOpen(i)).length;
  $('#dragInfo').innerHTML = `Bana ${open} av ${TRACKS.length} · ${coinIcon('16px')} ${d.coins}`;
  updateBatteries();
}
let previewBusy = false;
async function renderPreviews() {
  if (previewBusy || isLite()) return; previewBusy = true;
  try { await document.fonts.ready; } catch {}
  const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-4000px;top:0;width:760px;height:500px;pointer-events:none';
  document.body.appendChild(host);
  let v = null;
  try {
    v = createView(host, { bloom: [.4, .45, .9], exposure: 1.0 });
    for (const [mod, id] of [[mine, 'mineArt'], [drag, 'dragArt']]) {
      const p = mod.previewScene(v); v.setScene(p.scene); p.camera(v.camera); v.camera.aspect = v.w / v.h; v.camera.updateProjectionMatrix();
      v.render(); const url = v.renderer.domElement.toDataURL('image/jpeg', .88);
      const img = $('#' + id); img.onload = () => img.classList.add('on'); img.src = url;
      await new Promise(r => setTimeout(r, 30));
    }
  } catch (e) { console.error(e); }
  finally { if (v) v.dispose(); host.remove(); previewBusy = false; }
}
function show(id) { for (const s of ['home', 'game', 'sleep']) $('#' + s).hidden = s !== id; }
async function start(mod) {
  audioInit(); sfx.tap();
  let waited = false; const t = setTimeout(() => { waited = true; toast('Laddar…'); }, 400);
  await Promise.race([cloudReady(), new Promise(r => setTimeout(r, 6000))]); clearTimeout(t);
  if (current) return;
  if (timer.left() <= 0) return sleep();
  show('game'); current = mod;
  try { mod.enter($('#stage'), $('#hud'), api); } catch (e) { if (window.__showErr) window.__showErr('start: ' + (e && e.message)); current = null; show('home'); toast('Spelet kunde inte starta. Prova Snabb grafik under föräldrar.', 4000); return; } timer.start(); updateBatteries(); music.mood(mod === mine ? 'mine' : 'drag');
}
function goHome() { if (current) { current.exit(); current = null; } timer.stop(); show('home'); renderHome(); music.mood('home'); setTimeout(renderPreviews, 300); }
function sleep() { if (current) { current.exit(); current = null; } timer.stop(); closePanel(); music.stop(); show('sleep'); say('Batteriet är slut. Vi ses imorgon!'); }
timer.onEnd = sleep;
timer.onWarn = () => { toast('En minut kvar'); say('En minut kvar.'); };
$('#playMine').onclick = () => start(mine);
$('#playDrag').onclick = () => start(drag);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* parent area: passcode, then settings */
const PIN = '1385';
function parentGate(onOk = () => settings()) {
  let code = '';
  const body = openPanel('För föräldrar', `<div class="pin"><p>Skriv koden</p><div class="pdots">${'<i></i>'.repeat(4)}</div><div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-n="${n}">${n}</button>`).join('')}<span></span><button data-n="0">0</button><button data-del="1" aria-label="Sudda">⌫</button></div><div class="err" id="pinErr" style="color:#ff8a7a;font-weight:800;min-height:1.2em"></div></div>`, '#7b61ff');
  const dots = [...body.querySelectorAll('.pdots i')], err = body.querySelector('#pinErr'), row = body.querySelector('.pdots');
  const draw = () => dots.forEach((d, i) => d.classList.toggle('on', i < code.length));
  const press = n => {
    err.textContent = '';
    if (n === 'del') { code = code.slice(0, -1); draw(); return; }
    if (code.length >= 4) return; code += n; draw();
    if (code.length === 4) {
      if (code === PIN) { document.removeEventListener('keydown', onKey); setTimeout(onOk, 150); }
      else { err.textContent = 'Fel kod'; row.classList.add('shake'); setTimeout(() => { code = ''; draw(); row.classList.remove('shake'); }, 500); }
    }
  };
  const onKey = e => { if (!$('#panel').classList.contains('on')) { document.removeEventListener('keydown', onKey); return; } if (/^[0-9]$/.test(e.key)) press(e.key); if (e.key === 'Backspace') press('del'); };
  document.addEventListener('keydown', onKey);
  body.querySelectorAll('.pad button').forEach(b => b.onclick = () => press(b.dataset.del ? 'del' : b.dataset.n));
}
function settings(confirmReset = false) {
  const st = S.settings, lv = t => { const acc = accuracy(t); return `<span>${LT[t].name}</span><span class="ldesc">Nivå ${levelOf(t)} av ${LT[t].max}: ${LEVEL_TEXT[t][levelOf(t)]}${acc != null ? ` · ${acc}% rätt på första försöket` : ''}</span><span><button class="lvbtn" data-t="${t}" data-d="-1" aria-label="Lättare">−</button> <button class="lvbtn" data-t="${t}" data-d="1" aria-label="Svårare">+</button></span>`; };
  const body = openPanel('Inställningar', `<div class="parent">
    <label>Speltid per dag</label>
    <div class="seg" id="mins">${[5, 10, 15, 20, 30, 45, 60].map(m => `<button data-m="${m}" class="${st.minutes === m ? 'on' : ''}">${m} min</button>`).join('')}</div>
    <label>Kvar idag: ${Math.ceil(timer.left() / 60)} min${S.day.bonus ? ` (varav ${Math.round(S.day.bonus / 60)} min extra)` : ''}</label>
    <div class="seg" id="extend">${[5, 10, 15, 30].map(m => `<button data-x="${m}">+${m} min idag</button>`).join('')}</div>
    <label>Övningar</label>
    <div class="seg"><button id="tMath" class="${st.math ? 'on' : ''}">Matte</button><button id="tRead" class="${st.read ? 'on' : ''}">Läsa</button><button id="tFa" class="${st.farsi !== false ? 'on' : ''}">Persiska</button></div>
    <label>Nivå (anpassas automatiskt efter hur det går)</label>
    <div class="lv">${lv('math')}${lv('read')}${(() => { const f = faProgress(); return `<span>Persiska</span><span class="ldesc">${f.stage ? `Ord, steg ${f.stage} av 3` : `Bokstäver: ${f.letters} av ${f.total} klara (grupp ${f.set + 1} av 8)`}</span><span><button class="lvbtn" id="faDown" aria-label="Lättare">−</button> <button class="lvbtn" id="faUp" aria-label="Svårare">+</button></span>`; })()}</div>
    <label>Spara</label>
    <p style="margin:0;color:var(--muted);font-weight:800;font-size:14px">Framstegen sparas på kontot när spelet öppnas inloggad, annars i den här webbläsaren.</p>
    <label>Grafik</label>
    <div class="seg" id="gfx"><button data-g="lite" class="${isLite() ? 'on' : ''}">Snabb (för äldre telefoner)</button><button data-g="nice" class="${isLite() ? '' : 'on'}">Snygg</button></div>
    <label>Felrapport · version 13</label>
    <p style="margin:0;color:var(--muted);font-weight:800;font-size:13px;white-space:pre-wrap;-webkit-user-select:text;user-select:text">${(window.__errLog || []).length ? (window.__errLog || []).slice(-10).join('\n') : 'Inga fel.'}</p>
    <label>Börja om</label>
    <div class="seg">${confirmReset ? '<button id="resetYes" class="danger">Ja, radera allt</button><button id="resetNo">Avbryt</button>' : '<button id="reset">Nollställ spelet</button>'}</div>
    ${confirmReset ? '<p style="margin:6px 0 0;color:#ff8a7a;font-weight:800">Alla stenar, bilar och nivåer försvinner. Det går inte att ångra.</p>' : ''}
  </div>`, '#7b61ff');
  body.querySelectorAll('#mins button').forEach(b => b.onclick = () => { st.minutes = +b.dataset.m; save(); updateBatteries(); settings(); });
  body.querySelectorAll('#extend button').forEach(b => b.onclick = () => { const m = +b.dataset.x; S.day.bonus += m * 60; save(); updateBatteries(); toast(`+${m} minuter idag`); if (!$('#sleep').hidden) { show('home'); renderHome(); music.mood('home'); setTimeout(renderPreviews, 300); } settings(); });
  body.querySelector('#tMath').onclick = () => { st.math = !st.math; if (!st.math && !st.read) st.read = true; save(); settings(); };
  body.querySelector('#tRead').onclick = () => { st.read = !st.read; if (!st.math && !st.read) st.math = true; save(); settings(); };
  body.querySelector('#tFa').onclick = () => { st.farsi = st.farsi === false; save(); settings(); };
  body.querySelector('#faUp').onclick = () => { faSetLevel(faProgress().set + 1); settings(); };
  body.querySelector('#faDown').onclick = () => { faSetLevel(faProgress().set - 1); settings(); };
  body.querySelectorAll('.lvbtn[data-t]').forEach(b => b.onclick = () => { const t = b.dataset.t; setLevel(t, Math.max(1, Math.min(LT[t].max, levelOf(t) + +b.dataset.d))); settings(); });
  body.querySelectorAll('#gfx button').forEach(b => b.onclick = () => { st.gfx = b.dataset.g; save(); toast('Grafiken ändras när spelet startas nästa gång'); settings(); });
  const r = body.querySelector('#reset'); if (r) r.onclick = () => settings(true);
  const ry = body.querySelector('#resetYes'); if (ry) ry.onclick = () => { resetProgress(); renderHome(); settings(); toast('Spelet är nollställt'); };
  const rn = body.querySelector('#resetNo'); if (rn) rn.onclick = () => settings();
}
$('#parentBtn').onclick = () => parentGate(); $('#parentBtn2').onclick = () => parentGate();
function quickExtend() {
  const body = openPanel('Förläng tiden', `<div class="parent"><label>Hur mycket extra tid idag?</label><div class="seg" id="qx">${[5, 10, 15, 30].map(m => `<button data-x="${m}" style="font-size:22px;padding:14px 20px">+${m} min</button>`).join('')}</div><label>&nbsp;</label><button class="pill" id="qxMore">Fler inställningar</button></div>`, '#7b61ff');
  body.querySelectorAll('#qx button').forEach(b => b.onclick = () => { const m = +b.dataset.x; S.day.bonus += m * 60; save(); updateBatteries(); closePanel(); toast(`+${m} minuter idag`); show('home'); renderHome(); music.mood('home'); setTimeout(renderPreviews, 300); });
  body.querySelector('#qxMore').onclick = () => settings();
}
$('#extendBtn').onclick = () => parentGate(quickExtend);

renderHome();
if (timer.left() <= 0) show('sleep');
setTimeout(renderPreviews, 200);
initCloud(() => { if (!current) { renderHome(); renderPreviews(); } });
</script>

</body>
</html>
